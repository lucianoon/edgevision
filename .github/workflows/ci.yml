name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python-cpu:
    # CPU-only checks: the Python pipeline, ONNX exports and all tests that do not need
    # a GPU (TensorRT / C++ runtime tests skip themselves).
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install (CPU torch wheel, then the rest)
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements.txt

      - name: Cache model files (weights + exports)
        uses: actions/cache@v4
        with:
          path: |
            models/pytorch/yolo26n.pt
            models/onnx/yolo26n.onnx
            models/onnx/yolo26n_nms.onnx
          key: yolo26n-${{ hashFiles('scripts/export_onnx.py') }}

      - name: Export ONNX graphs (raw head and NMS in graph)
        run: |
          test -f models/onnx/yolo26n.onnx || python scripts/export_onnx.py
          test -f models/onnx/yolo26n_nms.onnx || python scripts/export_onnx.py --nms

      - name: Tests
        run: python -m pytest -q -rs

      - name: Smoke run (headless, still image, both backends)
        env:
          PYTHONPATH: python
        run: |
          python - <<'EOF'
          import cv2
          from ultralytics.utils import ASSETS
          img = cv2.imread(str(ASSETS / "bus.jpg"))
          w = cv2.VideoWriter("videos/ci.mp4", cv2.VideoWriter_fourcc(*"mp4v"), 30, (img.shape[1], img.shape[0]))
          for _ in range(20): w.write(img)
          w.release()
          EOF
          python -m edgevision.main --backend pytorch --source videos/ci.mp4 --no-display --max-frames 10
          python -m edgevision.main --backend onnx --source videos/ci.mp4 --no-display --max-frames 10

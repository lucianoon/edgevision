name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    # Static checks, no model downloads: ruff (lint + format), shellcheck on every script.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install ruff (pinned)
        run: python -m pip install $(grep -E '^ruff==' requirements-dev.txt)

      - name: ruff check
        run: ruff check python scripts tests

      - name: ruff format --check
        run: ruff format --check python scripts tests

      - name: shellcheck
        run: shellcheck -S warning scripts/*.sh scripts/aws/*.sh

  python-cpu:
    # CPU-only checks: the Python pipeline, ONNX exports and all tests that do not need
    # a GPU (TensorRT / C++ runtime tests skip themselves).
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.lock

      - name: Install (pinned; CPU torch wheel first, then the lock)
        run: |
          python -m pip install --upgrade pip
          # torch and torchvision must come from the same index/build (the NMS export imports
          # torchvision.ops.nms) and at the versions the lock pins, so the lock never pulls the CUDA build.
          python -m pip install $(grep -E '^(torch|torchvision)==' requirements.lock) --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements.lock -r requirements-dev.txt
          python -m pip install -e . --no-deps

      - name: Cache model files (weights + exports)
        uses: actions/cache@v6
        with:
          path: |
            models/pytorch/yolo26n.pt
            models/onnx/yolo26n.onnx
            models/onnx/yolo26n_nms.onnx
          key: yolo26n-${{ hashFiles('scripts/export_onnx.py') }}

      - name: Export ONNX graphs (raw head and NMS in graph)
        run: |
          test -f models/onnx/yolo26n.onnx || python scripts/export_onnx.py
          test -f models/onnx/yolo26n_nms.onnx || python scripts/export_onnx.py --nms

      - name: mypy
        run: python -m mypy

      - name: Tests (coverage floor 80%; the TensorRT path is GPU-only and excluded)
        run: python -m pytest -q -rs --cov --cov-report=term-missing --cov-fail-under=80

      - name: Smoke run (headless, still image, both backends, installed console script)
        run: |
          python - <<'EOF'
          import cv2
          from ultralytics.utils import ASSETS
          img = cv2.imread(str(ASSETS / "bus.jpg"))
          w = cv2.VideoWriter("videos/ci.mp4", cv2.VideoWriter_fourcc(*"mp4v"), 30, (img.shape[1], img.shape[0]))
          for _ in range(20): w.write(img)
          w.release()
          EOF
          edgevision --backend pytorch --source videos/ci.mp4 --no-display --max-frames 10
          edgevision --backend onnx --source videos/ci.mp4 --no-display --max-frames 10

  cpp-cpu:
    # The GPU runtime needs TensorRT and is built on the GPU box (scripts/gpu_sprint*.sh).
    # edgevision_cpu (ByteTrack, metrics, class names, CLI, JSON report) is dependency-free,
    # so it is built with strict warnings, unit-tested, formatted and linted here on every push.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Configure (edgevision_cpu only, no CUDA / TensorRT)
        run: cmake -S cpp -B cpp/build-cpu -DEDGEVISION_CPU_ONLY=ON -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build cpp/build-cpu --parallel

      - name: Test
        run: ctest --test-dir cpp/build-cpu --output-on-failure

      - name: clang-format (whole C++ tree, cpp/.clang-format)
        run: |
          clang-format --version
          clang-format --dry-run --Werror cpp/src/*.cpp cpp/src/*.cu cpp/include/edgevision/*.hpp cpp/tests/*.cpp cpp/tests/*.hpp

      - name: clang-tidy (CPU sources, cpp/.clang-tidy; findings are errors)
        run: |
          command -v clang-tidy >/dev/null || sudo apt-get install -y clang-tidy
          clang-tidy --version
          clang-tidy cpp/src/tracker.cpp cpp/src/metrics.cpp cpp/src/names.cpp cpp/src/cli.cpp cpp/src/report.cpp                      cpp/tests/test_tracker.cpp cpp/tests/test_cli.cpp cpp/tests/test_report.cpp                      -- -std=c++17 -Icpp/include

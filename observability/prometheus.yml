# Scrapes the two EdgeVision endpoints on the host. 1 s so the per-window latency gauges
# follow the stream closely; the exporter is a cheap text render, not a query.
global:
  scrape_interval: 1s
  evaluation_interval: 15s

scrape_configs:
  - job_name: edgevision-app          # edgevision --metrics-port 9108
    static_configs:
      - targets: ["host.docker.internal:9108"]
  - job_name: edgevision-events       # edgevision-events ... --metrics-port 9109
    static_configs:
      - targets: ["host.docker.internal:9109"]
